name: Security regression checks
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tenant-and-evidence-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:structure
      - run: pnpm test tests/unit/assessment.test.ts tests/unit/limiter.test.ts tests/integration/pipeline.test.ts
