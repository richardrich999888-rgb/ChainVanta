name: CI
on:
  push:
    branches: [main, develop, 'feature/**', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chainvanta_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d chainvanta_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/chainvanta_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:structure
      - run: pnpm format:check
      - run: pnpm api:generate
      - run: git diff --exit-code -- packages/api-contracts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm sbom
      - uses: actions/upload-artifact@v4
        with:
          name: production-node-sbom
          path: .local/sbom.cdx.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache-dependency-path: workers/blockchain-indexer/go.sum
      - run: go test ./... && go vet ./... && go build ./cmd/indexer
        working-directory: workers/blockchain-indexer
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: workers/blockchain-indexer
